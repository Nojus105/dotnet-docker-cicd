name: Build, Publish, Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify container locally
        run: |
          docker build --build-arg APP_VERSION=${{ github.sha }} -t status-api:test .
          chmod +x deploy/deploy_and_verify.sh
          ./deploy/deploy_and_verify.sh status-api:test

  publish:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR and push SHA-tagged image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/status-api:${{ github.sha }}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --build-arg APP_VERSION=${{ github.sha }} -t "$IMAGE" .
          docker push "$IMAGE"

  deploy-staging:
    needs: publish
    environment: staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and verify on staging
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/status-api:${{ github.sha }}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE"
          chmod +x deploy/deploy_and_verify.sh
          ./deploy/deploy_and_verify.sh "$IMAGE"

  deploy-production:
    needs: deploy-staging
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Promote verified SHA image to production
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/status-api:${{ github.sha }}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE"
          chmod +x deploy/deploy_and_verify.sh
          ./deploy/deploy_and_verify.sh "$IMAGE"